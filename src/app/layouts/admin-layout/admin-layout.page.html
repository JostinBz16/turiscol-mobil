<ion-split-pane when="lg" contentId="admin-main">
  <ion-menu contentId="admin-main" class="admin-menu">
    <ion-content>
      <div class="menu-brand">
        <span class="brand-mark" aria-hidden="true">
          <ion-icon name="compass-outline"></ion-icon>
        </span>
        <div class="brand-text">
          <span class="brand-name">Turiscol</span>
          <span class="brand-subtitle">Administración</span>
        </div>
      </div>

      <ion-list lines="none">
        <ion-item routerLink="dashboard" routerLinkActive="selected" lines="none" button detail="false">
          <ion-icon slot="start" name="home-outline"></ion-icon>
          <ion-label>Resumen</ion-label>
        </ion-item>

        <ion-item routerLink="prices" routerLinkActive="selected" lines="none" button detail="false">
          <ion-icon slot="start" name="cash-outline"></ion-icon>
          <ion-label>Precios</ion-label>
        </ion-item>

        <ion-item routerLink="users" routerLinkActive="selected" lines="none" button detail="false">
          <ion-icon slot="start" name="people-outline"></ion-icon>
          <ion-label>Usuarios</ion-label>
        </ion-item>

        <ion-item routerLink="providers" routerLinkActive="selected" lines="none" button detail="false">
          <ion-icon slot="start" name="storefront-outline"></ion-icon>
          <ion-label>Proveedores</ion-label>
        </ion-item>

        <ion-item routerLink="offers" routerLinkActive="selected" lines="none" button detail="false">
          <ion-icon slot="start" name="pricetags-outline"></ion-icon>
          <ion-label>Ofertas</ion-label>
        </ion-item>

        <ion-item routerLink="festivities" routerLinkActive="selected" lines="none" button detail="false">
          <ion-icon slot="start" name="calendar-outline"></ion-icon>
          <ion-label>Festividades</ion-label>
        </ion-item>

        <ion-item routerLink="locations" routerLinkActive="selected" lines="none" button detail="false">
          <ion-icon slot="start" name="map-outline"></ion-icon>
          <ion-label>Ubicaciones</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>

    <!-- Pinned to the bottom of the menu so it is always visible. -->
    <ion-footer class="ion-no-border">
      <div class="menu-footer">
        <ion-button class="logout-button" expand="block" fill="outline" color="danger" (click)="logout()">
          <ion-icon slot="start" name="log-out-outline"></ion-icon>
          Cerrar sesión
        </ion-button>
      </div>
    </ion-footer>
  </ion-menu>

  <ion-router-outlet id="admin-main"></ion-router-outlet>
</ion-split-pane>
