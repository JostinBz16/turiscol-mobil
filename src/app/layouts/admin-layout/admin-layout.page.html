<ion-split-pane when="(min-width: 0px)" contentId="admin-main">
  <ion-menu contentId="admin-main">
    <ion-content>
      <ion-list>
        <ion-item routerLink="dashboard" routerLinkActive="selected" lines="none" button>
          <ion-icon slot="start" name="home-outline"></ion-icon>
          <ion-label>Resumen</ion-label>
        </ion-item>

        <ion-item routerLink="prices" routerLinkActive="selected" lines="none" button>
          <ion-icon slot="start" name="cash-outline"></ion-icon>
          <ion-label>Precios</ion-label>
        </ion-item>

        <ion-item routerLink="users" routerLinkActive="selected" lines="none" button>
          <ion-icon slot="start" name="people-outline"></ion-icon>
          <ion-label>Usuarios</ion-label>
        </ion-item>

        <ion-item routerLink="providers" routerLinkActive="selected" lines="none" button>
          <ion-icon slot="start" name="storefront-outline"></ion-icon>
          <ion-label>Proveedores</ion-label>
        </ion-item>

        <ion-item routerLink="festivities" routerLinkActive="selected" lines="none" button>
          <ion-icon slot="start" name="calendar-outline"></ion-icon>
          <ion-label>Festividades</ion-label>
        </ion-item>

        <ion-item routerLink="locations" routerLinkActive="selected" lines="none" button>
          <ion-icon slot="start" name="map-outline"></ion-icon>
          <ion-label>Ubicaciones</ion-label>
        </ion-item>

        <ion-item lines="none" button (click)="logout()">
          <ion-icon slot="start" name="log-out-outline"></ion-icon>
          <ion-label>Cerrar sesión</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="admin-main"></ion-router-outlet>
</ion-split-pane>
