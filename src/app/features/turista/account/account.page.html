<ion-header class="home-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back" color="primary"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Mi Cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen class="account-content">
  <!-- Header -->
  <div class="account-header">
    <div class="icon-wrapper">
      <ion-icon name="person-outline"></ion-icon>
    </div>

    <h2 class="name">{{ authService.user()?.userName ?? 'Usuario' }}</h2>
    <p class="email">{{ authService.user()?.email ?? '' }}</p>
  </div>

  <!-- Opciones -->
  <ion-list class="account-list" lines="none">
    <ion-item button detail="false" (click)="goToEditProfile()">
      <div class="item-left">
        <div class="icon-box">
          <ion-icon name="create-outline"></ion-icon>
        </div>
        <span>Editar Perfil</span>
      </div>

      <ion-icon slot="end" name="chevron-forward-outline" class="chevron"></ion-icon>
    </ion-item>

    @if (role() === 'turista') {
    <ion-item button detail="false" (click)="goToReservations()">
      <div class="item-left">
        <div class="icon-box">
          <ion-icon name="bookmark-outline"></ion-icon>
        </div>
        <span>Mis Reservas</span>
      </div>
      <ion-icon slot="end" name="chevron-forward-outline" class="chevron"></ion-icon>
    </ion-item>
    <ion-item button detail="false" (click)="goToFavorites()">
      <div class="item-left">
        <div class="icon-box">
          <ion-icon name="heart-outline"></ion-icon>
        </div>
        <span>Mis favoritos</span>
      </div>

      <ion-icon slot="end" name="chevron-forward-outline" class="chevron"></ion-icon>
    </ion-item>
    } @if (role() === 'proveedor') {
    <ion-item button detail="false" (click)="goToManageOffers()">
      <div class="item-left">
        <div class="icon-box">
          <ion-icon name="grid-outline"></ion-icon>
        </div>
        <span>Mis Ofertas</span>
      </div>
      <ion-icon slot="end" name="chevron-forward-outline" class="chevron"></ion-icon>
    </ion-item>
    <ion-item button detail="false" (click)="goToSales()">
      <div class="item-left">
        <div class="icon-box">
          <ion-icon name="receipt-outline"></ion-icon>
        </div>
        <span>Mis Ventas</span>
      </div>
      <ion-icon slot="end" name="chevron-forward-outline" class="chevron"></ion-icon>
    </ion-item>
    }
  </ion-list>

  <!-- Logout -->
  <div class="logout-container">
    <ion-button color="danger" expand="block" (click)="logout()">
      <ion-icon slot="start" name="log-out-outline"></ion-icon>
      Cerrar Sesión
    </ion-button>
  </div>
</ion-content>
