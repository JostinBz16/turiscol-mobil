<ion-header>
  <ion-toolbar>
    <div class="header-row">
      <span class="page-title">Precios</span>
      <ion-buttons>
        <ion-button (click)="goToProfile()" color="light">
          <ion-icon slot="icon-only" name="person" size="small"></ion-icon>
        </ion-button>
      </ion-buttons>
    </div>
  </ion-toolbar>
</ion-header>

<app-city-bar/>

<ion-content>
  <div class="prices-container">
    <app-city-filter (select)="goToCity($event)"></app-city-filter>

    <div class="empty-state">
      <ion-icon name="location-outline"></ion-icon>
      <h4>Selecciona una ciudad</h4>
      <p>Elige una ciudad para ver los precios de referencia</p>
    </div>
  </div>
</ion-content>
