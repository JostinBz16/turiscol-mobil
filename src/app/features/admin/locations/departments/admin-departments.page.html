<ion-header class="page-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin-dashboard/locations"></ion-back-button>
    </ion-buttons>
    <ion-title>Departamentos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  @if (loading()) {
    <div class="loading-center">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  } @else {
    @if (departments().length === 0) {
      <div class="empty-state">
        <p>No hay departamentos registrados</p>
      </div>
    } @else {
      <ion-list>
        @for (department of departments(); track department.id) {
          <ion-item class="department-item" [routerLink]="[department.id, 'edit']">
            <ion-icon name="business-outline" slot="start"></ion-icon>
            <ion-label>
              <h2>{{ department.name }}</h2>
            </ion-label>
            <ion-button
              fill="clear"
              color="danger"
              slot="end"
              (click)="$event.stopPropagation(); confirmDelete(department)"
            >
              <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
            </ion-button>
            <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
          </ion-item>
        }
      </ion-list>
    }

    <ion-fab vertical="bottom" horizontal="end" slot="fixed">
      <ion-fab-button [routerLink]="['new']">
        <ion-icon name="add-outline"></ion-icon>
      </ion-fab-button>
    </ion-fab>
  }
</ion-content>
