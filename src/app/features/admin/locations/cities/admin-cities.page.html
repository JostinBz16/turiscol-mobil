<app-admin-page-header
  title="Destinos"
  subtitle="Administra los destinos turísticos y su visibilidad"
  [breadcrumbs]="[{ label: 'Ubicaciones', link: '/admin-dashboard/locations' }, { label: 'Destinos' }]"
  backLink="/admin-dashboard/locations"
  backLabel="Volver a ubicaciones"
>
  <ion-button actions fill="outline" (click)="refresh($event)">
    <ion-icon slot="start" name="refresh-outline"></ion-icon>
    Actualizar
  </ion-button>
  <ion-button actions [routerLink]="['new']">
    <ion-icon slot="start" name="add-outline"></ion-icon>
    Nuevo destino
  </ion-button>
</app-admin-page-header>

<ion-content>
  @if (loading()) {
  <div class="loading-center">
    <ion-spinner name="crescent"></ion-spinner>
  </div>
  } @else { @if (cities().length === 0) {
  <div class="empty-state">
    <p>No hay ciudades registradas</p>
  </div>
  } @else {
  <ion-list>
    @for (city of cities(); track city.id) {
    <ion-item class="city-item" [routerLink]="[city.id, 'edit']">
      <ion-icon name="map-outline" slot="start"></ion-icon>
      <ion-label>
        <h2>{{ city.name }}</h2>
        <p>{{ city.department.name }}</p>
      </ion-label>
      @if (city.featured) {
      <ion-badge color="warning" slot="end">Destacada</ion-badge>
      }
      <ion-button
        fill="clear"
        color="danger"
        slot="end"
        (click)="$event.stopPropagation(); confirmDelete(city)"
      >
        <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
    </ion-item>
    }
  </ion-list>
  }

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button [routerLink]="['new']">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
  }
</ion-content>
