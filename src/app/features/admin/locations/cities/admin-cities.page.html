<ion-header class="page-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin-dashboard/locations"></ion-back-button>
    </ion-buttons>
    <ion-title>Ciudades</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  @if (loading()) {
    <div class="loading-center">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  } @else {
    @if (cities().length === 0) {
      <div class="empty-state">
        <p>No hay ciudades registradas</p>
      </div>
    } @else {
      <ion-list>
        @for (city of cities(); track city.id) {
          <ion-item class="city-item" [routerLink]="[city.id, 'edit']">
            <ion-icon name="map-outline" slot="start"></ion-icon>
            <ion-label>
              <h2>{{ city.name }}</h2>
              <p>{{ city.department?.name }}</p>
            </ion-label>
            @if (city.featured) {
              <ion-badge color="warning" slot="end">Destacada</ion-badge>
            }
            <ion-button
              fill="clear"
              color="danger"
              slot="end"
              (click)="$event.stopPropagation(); confirmDelete(city)"
            >
              <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
            </ion-button>
            <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
          </ion-item>
        }
      </ion-list>
    }

    <ion-fab vertical="bottom" horizontal="end" slot="fixed">
      <ion-fab-button [routerLink]="['new']">
        <ion-icon name="add-outline"></ion-icon>
      </ion-fab-button>
    </ion-fab>
  }
</ion-content>
